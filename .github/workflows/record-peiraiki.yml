name: Ηχογράφηση Πειραϊκής Εκκλησίας (91.2)

# Ηχογραφεί τη ροή του σταθμού σύμφωνα με το πρόγραμμα του radio/config.json (ώρα Ελλάδας).
# Κάθε κομμάτι των 10 λεπτών ανεβαίνει, μόλις κλείσει, σε ένα GitHub Release της ημέρας
# (tag rec-ΕΕΕΕ-ΜΜ-ΗΗ)· η σελίδα radio.html τα παίζει ως μία συνεχή ηχογράφηση.
# Όλα ρυθμίζονται από τη διαχείριση (radio-admin.html): πρόγραμμα, ποιότητα, διατήρηση, έναρξη/διακοπή.
# Η λογική του προγράμματος είναι στο radio/schedule.js, κοινή με τη διαχείριση.
on:
  schedule:
    # Κάθε μισή ώρα· το βήμα «Απόφαση» κρίνει αν είναι ώρα ηχογράφησης.
    - cron: "13,43 * * * *"
  push:
    branches: [main]
    paths: [radio/control.json]
  workflow_dispatch:
    inputs:
      hours:
        description: "Ηχογράφηση τώρα για τόσες ώρες (κενό = κανονικό πρόγραμμα)"
        default: ""
      stream_url:
        description: "URL ροής (κενό = αυτόματος εντοπισμός)"
        default: ""
      program_tag:
        description: "Μόνο ενημέρωση προγράμματος για το release (π.χ. rec-2026-10-30), χωρίς ηχογράφηση"
        default: ""

permissions:
  contents: write

jobs:
  # Ενημέρωση του προγράμματος μιας ημέρας που υπάρχει ήδη (χειροκίνητα).
  program:
    if: github.event.inputs.program_tag != ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.inputs.program_tag }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: radio }
      - run: radio/update-program.sh "$TAG" "${TAG#rec-}"

  record:
    if: github.event.inputs.program_tag == '' || github.event.inputs.program_tag == null
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: peiraiki-live
      cancel-in-progress: false
    env:
      TZ: Europe/Athens
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HOURS: ${{ github.event.inputs.hours || '' }}
      STREAM_URL: ${{ github.event.inputs.stream_url || '' }}
      EVENT: ${{ github.event_name }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: radio }

      - name: Απόφαση
        id: when
        run: |
          echo "t0=$(date +%s)" >> "$GITHUB_OUTPUT"
          get() { gh api "repos/$GH_REPO/contents/radio/$1?ref=main" --jq .content 2>/dev/null | base64 -d > "$2" 2>/dev/null || echo '{}' > "$2"; }
          get config.json cfg.json; get control.json ctl.json
          node radio/schedule.js decide cfg.json ctl.json | tee -a "$GITHUB_OUTPUT"

      # Αυτόματη διαγραφή με βάση τη διατήρηση και το όριο χώρου (σε κάθε προγραμματισμένο τρέξιμο).
      - name: Διατήρηση χώρου
        if: github.event_name == 'schedule'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          out=$(node radio/maintain.js cleanup cfg.json) || { echo "::warning::Η διατήρηση χώρου απέτυχε"; exit 0; }
          echo "$out"
          if [ "$(jq '.deleted | length' <<<"$out")" -gt 0 ]; then
            radio/log.sh "$(jq -c --arg id "$RUN_ID-cleanup" --arg url "$RUN_URL" --argjson at "$(date +%s)" \
              '{id: $id, type: "cleanup", at: $at, url: $url, deleted: .deleted, totalBytes: .totalBytes}' <<<"$out")"
          fi

      - name: Εγκατάσταση ffmpeg
        if: steps.when.outputs.skip != '1'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Εντοπισμός ροής
        if: steps.when.outputs.skip != '1'
        id: find
        run: |
          echo "ERR=Δεν βρέθηκε λειτουργική ροή του σταθμού." >> "$GITHUB_ENV"
          cands=()
          [ -n "$STREAM_URL" ] && cands+=("$STREAM_URL")
          cands+=("https://impradio.bytemasters.gr/8002/stream")
          for q in "Πειραϊκή Εκκλησία" "Peiraiki Ekklisia" "Church of Piraeus"; do
            enc=$(jq -rn --arg s "$q" '$s|@uri')
            curl -sS --max-time 20 -A "peiraiki-recorder" \
              "https://all.api.radio-browser.info/json/stations/search?name=${enc}&hidebroken=true&order=votes&reverse=true" -o rb.json || continue
            while IFS= read -r u; do [ -n "$u" ] && cands+=("$u"); done < <(jq -r '.[] | .url_resolved' rb.json 2>/dev/null || true)
          done
          for u in "${cands[@]}"; do
            if info=$(timeout 25 ffprobe -v error -rw_timeout 15000000 -show_entries stream=codec_name,bit_rate,channels,sample_rate:format=bit_rate -of json "$u" 2>/dev/null) \
               && jq -e '.streams | length > 0' >/dev/null <<<"$info"; then
              src=$(jq -c '{codec: .streams[0].codec_name, kbps: (((.streams[0].bit_rate // .format.bit_rate // "0") | tonumber) / 1000 | floor), channels: .streams[0].channels, rate: ((.streams[0].sample_rate // "0") | tonumber)}' <<<"$info")
              echo "Ροή: $u  $src"
              { echo "url=$u"; echo "source=$src"; } >> "$GITHUB_OUTPUT"
              echo "ERR=" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Απέτυχε: $u"
          done
          echo "::error::Δεν βρέθηκε λειτουργική ροή."; exit 1

      - name: Ηχογράφηση
        if: steps.when.outputs.skip != '1'
        env:
          URL: ${{ steps.find.outputs.url }}
          SOURCE: ${{ steps.find.outputs.source }}
          T0: ${{ steps.when.outputs.t0 }}
          START: ${{ steps.when.outputs.start }}
          END: ${{ steps.when.outputs.end }}
          DAY: ${{ steps.when.outputs.day }}
          WHY: ${{ steps.when.outputs.why }}
          BITRATE: ${{ steps.when.outputs.bitrate }}
          CHANNELS: ${{ steps.when.outputs.channels }}
        run: |
          TAG="rec-$DAY"; echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "ERR=Η ηχογράφηση διακόπηκε απρόσμενα." >> "$GITHUB_ENV"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --latest=false \
            --title "Πειραϊκή Εκκλησία — $(date -d "$DAY" +%d/%m/%Y)" --notes "Ηχογραφήσεις από τη ροή $URL"
          # Το πρόγραμμα του σταθμού αλλάζει· διαβάζεται σε κάθε ηχογράφηση.
          radio/update-program.sh "$TAG" "$DAY"
          # Η κατάσταση γράφεται ως σχόλιο στο κείμενο του release· τη διαβάζει η διαχείριση.
          status() {
            local notes; notes=$(gh release view "$TAG" --json body --jq .body | sed '/^<!--status:/d')
            printf '%s\n<!--status:{"recording":%s,"since":%s,"until":%s,"updated":%s,"run":"%s","bitrate":%s,"channels":%s,"source":%s}-->\n' \
              "$notes" "$1" "$START" "$END" "$(date +%s)" "$RUN_URL" "$BITRATE" "$CHANNELS" "${SOURCE:-null}" > notes.md
            gh release edit "$TAG" --notes-file notes.md >/dev/null || true
          }
          log() {
            local n b; n=$(cat uploaded.txt 2>/dev/null | wc -l); b=0
            for f in $(cat uploaded.txt 2>/dev/null); do b=$((b + $(stat -c %s "$f"))); done
            radio/log.sh "$(jq -cn --arg id "$RUN_ID-rec" --arg url "$RUN_URL" --arg tag "$TAG" --arg why "$WHY" --arg ev "$EVENT" \
              --arg state "$1" --arg err "${2:-}" --argjson since "$START" --argjson until "$END" --argjson at "$(date +%s)" \
              --argjson segs "$n" --argjson bytes "$b" --argjson q "{\"bitrate\":$BITRATE,\"channels\":$CHANNELS}" --argjson src "${SOURCE:-null}" \
              '{id: $id, type: "record", state: $state, error: $err, at: $at, url: $url, tag: $tag, why: $why, event: $ev, since: $since, until: $until, segments: $segs, bytes: $bytes, quality: $q, source: $src}')"
          }
          stop_requested() {
            local ctl; ctl=$(gh api "repos/$GH_REPO/contents/radio/control.json?ref=main" --jq .content 2>/dev/null | base64 -d 2>/dev/null) || return 1
            [ "$(jq -r '.cmd // ""' <<<"$ctl" 2>/dev/null)" = stop ] && [ "$(jq -r '.at // 0 | floor' <<<"$ctl" 2>/dev/null)" -gt "$T0" ]
          }

          wait_s=$(( START - $(date +%s) ))
          if [ "$wait_s" -gt 0 ]; then echo "Αναμονή $((wait_s/60))′ έως την έναρξη"; log waiting; sleep "$wait_s"; fi

          # Έλεγχος για οδηγία διακοπής από τη διαχείριση.
          ( while sleep 45; do
              if stop_requested; then echo "Διακοπή από τη διαχείριση."; touch stop.flag; pkill -INT -x ffmpeg || true; break; fi
            done ) &
          WATCH=$!

          # Ανεβάζει κάθε κλεισμένο κομμάτι (όλα εκτός από αυτό που γράφεται).
          mkdir -p parts; : > uploaded.txt
          ( while :; do
              shopt -s nullglob; files=(parts/*.mp3); n=${#files[@]}
              for ((i=0; i<n-1; i++)); do
                f=${files[i]}
                [ "$(stat -c %s "$f")" -lt 24576 ] && continue   # υπόλοιπο χωρίς ήχο
                grep -qxF "$f" uploaded.txt || { gh release upload "$TAG" "$f" --clobber && echo "$f" >> uploaded.txt && status true && log recording; } || true
              done
              [ -f done.flag ] && break
              sleep 20
            done ) &
          UP=$!
          status true; log recording

          # Αν κοπεί η ροή, ξαναξεκινά μέχρι να τελειώσει ο χρόνος.
          while [ ! -f stop.flag ]; do
            left=$(( END - $(date +%s) )); [ "$left" -lt 10 ] && break
            ffmpeg -nostdin -hide_banner -loglevel warning \
              -reconnect 1 -reconnect_streamed 1 -reconnect_at_eof 1 -reconnect_delay_max 30 \
              -rw_timeout 30000000 -i "$URL" -t "$left" -vn \
              -c:a libmp3lame -b:a "${BITRATE}k" -ac "$CHANNELS" -ar 44100 \
              -f segment -segment_time 600 -reset_timestamps 1 -strftime 1 \
              "parts/peiraiki_%Y-%m-%d_%H-%M-%S_${BITRATE}k.mp3" || true
            if [ ! -f stop.flag ] && [ "$(( END - $(date +%s) ))" -ge 10 ]; then sleep 5; fi
          done
          touch done.flag; kill "$WATCH" 2>/dev/null || true; wait "$UP" || true
          [ -f stop.flag ] && echo "STOPPED=1" >> "$GITHUB_ENV"
          echo "ERR=" >> "$GITHUB_ENV"

      # Τρέχει και σε ακύρωση ή αποτυχία, ώστε να μη χαθεί το τελευταίο κομμάτι και να καταγραφεί το αποτέλεσμα.
      - name: Ολοκλήρωση
        if: always() && steps.when.outputs.skip != '1'
        env:
          START: ${{ steps.when.outputs.start }}
          END: ${{ steps.when.outputs.end }}
          WHY: ${{ steps.when.outputs.why }}
          BITRATE: ${{ steps.when.outputs.bitrate }}
          CHANNELS: ${{ steps.when.outputs.channels }}
          SOURCE: ${{ steps.find.outputs.source }}
          JOB_STATUS: ${{ job.status }}
        run: |
          touch done.flag
          shopt -s nullglob
          if [ -n "$TAG" ]; then
            for f in parts/*.mp3; do
              [ "$(stat -c %s "$f")" -ge 24576 ] || continue
              grep -qxF "$f" uploaded.txt 2>/dev/null || { gh release upload "$TAG" "$f" --clobber && echo "$f" >> uploaded.txt; } || true
            done
            notes=$(gh release view "$TAG" --json body --jq .body | sed '/^<!--status:/d')
            printf '%s\n<!--status:{"recording":false,"since":%s,"until":%s,"updated":%s,"run":"%s","bitrate":%s,"channels":%s,"source":%s}-->\n' \
              "$notes" "$START" "$END" "$(date +%s)" "$RUN_URL" "${BITRATE:-0}" "${CHANNELS:-0}" "${SOURCE:-null}" > notes.md
            gh release edit "$TAG" --notes-file notes.md >/dev/null || true
            radio/update-program.sh "$TAG" "${TAG#rec-}"
          fi
          if [ -n "$ERR" ] || [ "$JOB_STATUS" != success ]; then state=failed; elif [ -n "$STOPPED" ]; then state=stopped; else state=done; fi
          [ "$JOB_STATUS" = cancelled ] && { state=failed; ERR="Η εκτέλεση ακυρώθηκε."; }
          n=$(cat uploaded.txt 2>/dev/null | wc -l); b=0
          for f in $(cat uploaded.txt 2>/dev/null); do b=$((b + $(stat -c %s "$f"))); done
          radio/log.sh "$(jq -cn --arg id "$RUN_ID-rec" --arg url "$RUN_URL" --arg tag "${TAG:-}" --arg why "${WHY:-}" --arg ev "$EVENT" \
            --arg state "$state" --arg err "${ERR:-}" --argjson since "${START:-0}" --argjson until "${END:-0}" --argjson at "$(date +%s)" \
            --argjson segs "$n" --argjson bytes "$b" --argjson q "{\"bitrate\":${BITRATE:-0},\"channels\":${CHANNELS:-0}}" --argjson src "${SOURCE:-null}" \
            '{id: $id, type: "record", state: $state, error: $err, at: $at, url: $url, tag: $tag, why: $why, event: $ev, since: $since, until: $until, segments: $segs, bytes: $bytes, quality: $q, source: $src}')"
          # Κρατά ενεργό το πρόγραμμα: το GitHub σταματά τα schedules μετά από 60 μέρες χωρίς commits.
          if [ "$(date +%d)" = 01 ]; then
            sha=$(gh api "repos/$GH_REPO/contents/radio/heartbeat.txt" --jq .sha 2>/dev/null || true)
            gh api -X PUT "repos/$GH_REPO/contents/radio/heartbeat.txt" -f message="radio: heartbeat" \
              -f content="$(date +%F | base64)" ${sha:+-f sha="$sha"} >/dev/null || true
          fi
