<!DOCTYPE html>
<html lang="el">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
  <meta name="theme-color" content="#5e1a33">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Σημειωματάριο">
  <title>Εορτολόγιο — Ορθόδοξο Σημειωματάριο</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="assets/site.css">
  <script src="assets/site.js"></script>
  <script src="assets/calendar.js"></script>
  <style>
    .date-nav { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .date-arrow {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid var(--rule); background: var(--vellum); color: var(--ink-soft);
      font-size: 18px; line-height: 1; cursor: pointer;
    }
    .date-arrow:hover { border-color: var(--gold); color: var(--cinnabar); }
    .date-input {
      height: 36px; padding: 0 12px; border-radius: 999px;
      border: 1px solid var(--rule); background: var(--vellum); color: var(--ink);
      font-family: var(--font-body); font-size: 15px;
    }

    .syn-head { text-align: center; }
    .syn-wd { font-family: var(--font-display); font-size: 18px; color: var(--ink-soft); }
    .syn-date { font-family: var(--font-display); font-size: clamp(28px, 5vw, 38px); line-height: 1.15; color: var(--ink); }
    .syn-date.red { color: var(--cinnabar); }
    .syn-fast {
      display: inline-flex; align-items: center; gap: 8px; margin-top: .6rem;
      padding: 4px 14px; border: 1px solid var(--rule-soft); border-radius: 999px;
      font-size: 14.5px; color: var(--ink);
    }
    .syn-fast a { color: inherit; text-decoration: none; }
    .syn-feasts { list-style: none; margin: 1rem 0 0; padding: 0; text-align: center; }
    .syn-feasts li { font-family: var(--font-display); font-size: 20px; line-height: 1.35; color: var(--ink); }
    .syn-feasts li.red { color: var(--cinnabar); }
    .syn-names { text-align: center; margin: .5rem 0 0; color: var(--ink-soft); font-size: 15px; }
    .syn-names b { font-weight: 600; color: var(--ink); }

    .saints-title { margin-top: 1.6rem; }
    .saints { list-style: none; margin: 0; padding: 0; columns: 2 300px; column-gap: 2rem; }
    .saints li {
      break-inside: avoid; display: flex; gap: 10px; align-items: baseline;
      padding: .45rem 0; border-bottom: 1px solid var(--rule-soft); font-size: 16px;
    }
    .saints li a { color: var(--ink); text-decoration: none; }
    .saints li a:hover { color: var(--cinnabar); text-decoration: underline; }
    .saints li svg { width: 10px; height: 10px; color: var(--cinnabar); flex: none; position: relative; top: 1px; }
    .loading { text-align: center; padding: 2.5rem 0; color: var(--ink-faint); font-style: italic; }
    .error { padding: 1rem 1.2rem; border: 1px solid var(--rule); border-left: 3px solid var(--cinnabar); border-radius: 6px; background: var(--vellum); color: var(--ink-soft); font-size: 15px; }
    .source-note { margin-top: .8rem; font-size: 13px; color: var(--ink-faint); text-align: right; }
    .source-note a { color: var(--ink-soft); }
    .syn-mem { text-align: center; margin: .9rem 0 0; font-family: var(--font-display); font-size: 19px; line-height: 1.4; color: var(--ink); }
    .syn-mem small { display: block; font-family: var(--font-body); font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-deep); margin-bottom: 2px; }
    .syn-mem a { color: inherit; text-decoration: none; }
    .syn-mem a:hover { color: var(--cinnabar); }

    /* κινητές εορτές του έτους */
    .key-dates { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .key-date { all: unset; box-sizing: border-box; cursor: pointer; padding: .6rem .8rem; border: 1px solid var(--rule-soft); border-radius: 8px; background: var(--vellum); }
    .key-date:hover, .key-date:focus-visible { border-color: var(--cinnabar); }
    .key-date.great .key-date-label { color: var(--cinnabar); }
    .key-date[aria-current="true"] { border-color: var(--cinnabar); box-shadow: inset 3px 0 0 var(--cinnabar); }
    .key-date-label { font-size: 14px; color: var(--ink-soft); }
    .key-date-value { font-family: var(--font-display); font-size: 18px; color: var(--ink); }
  </style>
</head>

<body>
  <div class="ort-root">
    <div class="ort-shell">
      <header data-page="synaxarion" data-title="Εορτολόγιο" data-subtitle="Οι άγιοι και οι εορτές κάθε ημέρας"></header>

      <main>
        <div class="date-nav">
          <button class="date-arrow" type="button" onclick="shiftDay(-1)" aria-label="Προηγούμενη ημέρα">‹</button>
          <input type="date" id="date-picker" class="date-input" onchange="pickDate()" aria-label="Ημερομηνία">
          <button class="date-arrow" type="button" onclick="shiftDay(1)" aria-label="Επόμενη ημέρα">›</button>
          <button class="btn" type="button" onclick="goToday()">Σήμερα</button>
        </div>

        <section id="day-head" class="panel"></section>

        <section class="section saints-title">
          <h2 class="section-heading">Οι άγιοι της ημέρας</h2>
          <div id="saints"><div class="loading">Φόρτωση…</div></div>
        </section>

        <section class="section">
          <h2 class="section-heading" id="keydates-title">Κινητές εορτές</h2>
          <div id="keydates" class="key-dates"></div>
        </section>
      </main>

      <footer data-site-footer>Ο κατάλογος των αγίων προέρχεται από τον Ορθόδοξο Συναξαριστή <a href="https://www.saint.gr" target="_blank" rel="noopener">saint.gr</a>.</footer>
    </div>
  </div>

  <script>
    const C = window.OrthoCal;
    const CROSS = window.OrthoSite ? window.OrthoSite.SMALL_CROSS : '';
    const now = new Date();
    let viewDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    // ?d=ΕΕΕΕ-ΜΜ-ΗΗ (π.χ. από το νηστειοδρόμιο)
    { const q = /^(\d{4})-(\d{2})-(\d{2})$/.exec(new URLSearchParams(location.search).get('d') || ''); if (q) viewDate = new Date(+q[1], +q[2] - 1, +q[3]); }
    let requestId = 0;

    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function toISO(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    function readMonastic() { try { return localStorage.getItem('monasticMode') === 'true'; } catch (e) { return false; } }

    function renderHead(d) {
      const f = C.fasting(d, { monastic: readMonastic() });
      const feasts = C.feastsOf(d);
      const names = C.namedaysOf(d);
      const hymn = C.hymnOf(d);
      const red = d.getDay() === 0 || feasts.some(x => x.rank !== 'minor');
      document.getElementById('day-head').innerHTML = `
        <div class="syn-head">
          <div class="syn-wd">${C.DAYS[d.getDay()]}</div>
          <div class="syn-date${red ? ' red' : ''}">${d.getDate()} ${C.MONTHS_GEN[d.getMonth()]} ${d.getFullYear()}</div>
          <div class="syn-fast"><span class="seal lv-${f.level}"></span><a href="main.html" title="Άνοιγμα στο νηστειοδρόμιο">${esc(f.label)}${f.period ? ' · ' + esc(f.period) : ''}</a></div>
          ${feasts.length ? `<ul class="syn-feasts">${feasts.map(x => `<li class="${x.rank !== 'minor' ? 'red' : ''}">${esc(x.name)}</li>`).join('')}</ul>` : ''}
          <p class="syn-mem" id="syn-mem"${feasts.length ? ' hidden' : ''}></p>
          ${names.length ? `<p class="syn-names"><b>Εορτάζουν:</b> ${esc(names.join(', '))}</p>` : ''}
        </div>
        <blockquote class="hymn">
          <p class="hymn-text">${esc(hymn.text)}</p>
          <cite class="hymn-src">${esc(hymn.src)}</cite>
        </blockquote>`;
    }

    // ── Άγιοι της ημέρας ─────────────────────────────────────────────────
    // 1) το δικό μας endpoint (/api/saints, Vercel ή dev-server)· 2) δημόσιοι CORS proxies ως εφεδρεία.
    const PROXIES = [
      u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
      u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
      u => 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(u),
    ];

    async function fetchWithTimeout(url, ms) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), ms);
      try {
        const resp = await fetch(url, { signal: ctrl.signal });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        return resp;
      } finally { clearTimeout(timer); }
    }

    function undouble(name) {
      const w = name.split(' ');
      if (w.length % 2 === 0 && w.slice(0, w.length / 2).join(' ') === w.slice(w.length / 2).join(' ')) return w.slice(0, w.length / 2).join(' ');
      const half = name.length / 2;
      if (Number.isInteger(half) && name.slice(0, half).trim() === name.slice(half).trim()) return name.slice(0, half).trim();
      return name;
    }

    function decodePage(buf, contentType) {
      let charset = (/charset=([\w-]+)/i.exec(contentType || '') || [])[1];
      if (!charset) {
        const head = new TextDecoder('latin1').decode(buf.slice(0, 4096));
        charset = (/<meta[^>]+charset=["']?([\w-]+)/i.exec(head) || [])[1];
      }
      try { return new TextDecoder((charset || 'utf-8').toLowerCase()).decode(buf); }
      catch (e) { return new TextDecoder('utf-8').decode(buf); }
    }

    function parseSaints(html) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const out = [], seen = new Set();
      for (const a of doc.querySelectorAll('a[href*="saint.aspx"]')) {
        const href = a.getAttribute('href') || '';
        const id = (/\/(\d+)\/saint\.aspx/i.exec(href) || [])[1];
        const name = undouble(a.textContent.replace(/\s+/g, ' ').trim());
        if (!id || !name || seen.has(id)) continue;
        seen.add(id);
        out.push({ name, url: new URL(href, 'https://www.saint.gr/').href });
      }
      return out;
    }

    // Όλοι οι άγιοι του έτους μέσα στο site (data/saints.json, από το workflow saints-data.yml)
    let localSaints = null;
    function loadLocal() {
      if (!localSaints) localSaints = fetch('/data/saints.json').then(r => (r.ok ? r.json() : null)).catch(() => null);
      return localSaints;
    }

    async function loadSaints(m, d) {
      const key = 'saints-' + m + '-' + d;
      const local = await loadLocal();
      const day = local && local.days && local.days[String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0')];
      if (day && day.length) return day;
      try { const c = sessionStorage.getItem(key); if (c) return JSON.parse(c); } catch (e) { /* χωρίς αποθήκευση */ }

      const errors = [];
      let saints = null;
      try {
        const resp = await fetchWithTimeout(`/api/saints?m=${m}&d=${d}`, 12000);
        const json = await resp.json();
        if (!json.ok) throw new Error(json.error || 'σφάλμα');
        saints = json.saints;
      } catch (e) { errors.push('api: ' + e.message); }

      if (!saints || !saints.length) {
        const src = `https://www.saint.gr/${String(m).padStart(2, '0')}/${String(d).padStart(2, '0')}/index.aspx`;
        for (const proxy of PROXIES) {
          try {
            const resp = await fetchWithTimeout(proxy(src), 12000);
            const list = parseSaints(decodePage(await resp.arrayBuffer(), resp.headers.get('content-type')));
            if (list.length) { saints = list; break; }
            errors.push('proxy: κενή απάντηση');
          } catch (e) { errors.push('proxy: ' + e.message); }
        }
      }
      if (!saints || !saints.length) throw new Error(errors.join(' · '));
      try { sessionStorage.setItem(key, JSON.stringify(saints)); } catch (e) { /* χωρίς αποθήκευση */ }
      return saints;
    }

    // Οι κινητές εορτές του έτους της ημέρας που βλέπουμε (κλικ = μετάβαση στην ημέρα)
    function renderKeyDates(date) {
      const y = date.getFullYear(), e = C.easter(y);
      const items = [
        ['Αρχή του Τριωδίου', C.addDays(e, -70)], ['Κυριακή της Απόκρεω', C.addDays(e, -56)], ['Καθαρά Δευτέρα', C.addDays(e, -48)],
        ['Κυριακή της Ορθοδοξίας', C.addDays(e, -42)], ['Σάββατο του Λαζάρου', C.addDays(e, -8)], ['Κυριακή των Βαΐων', C.addDays(e, -7), true],
        ['Μεγάλη Παρασκευή', C.addDays(e, -2)], ['Άγιο Πάσχα', e, true], ['Ζωοδόχος Πηγή', C.addDays(e, 5)], ['Κυριακή του Θωμά', C.addDays(e, 7)],
        ['Μεσοπεντηκοστή', C.addDays(e, 24)], ['Ανάληψη', C.addDays(e, 39), true], ['Πεντηκοστή', C.addDays(e, 49), true],
        ['Αγίου Πνεύματος', C.addDays(e, 50)], ['Αγίων Πάντων', C.addDays(e, 56)], ['Άγιος Γεώργιος', C.georgeDate(y)],
      ];
      document.getElementById('keydates-title').textContent = 'Κινητές εορτές του ' + y;
      const box = document.getElementById('keydates');
      box.innerHTML = items.map(([l, d, g], i) =>
        `<button type="button" class="key-date${g ? ' great' : ''}" data-i="${i}"${toISO(d) === toISO(date) ? ' aria-current="true"' : ''}><div class="key-date-label">${l}</div><div class="key-date-value">${C.formatShort(d)}</div></button>`).join('');
      box.querySelectorAll('[data-i]').forEach(b => b.addEventListener('click', () => { viewDate = items[+b.dataset.i][1]; render(viewDate); window.scrollTo({ top: 0, behavior: 'smooth' }); }));
    }

    async function render(date) {
      document.getElementById('date-picker').value = toISO(date);
      renderHead(date);
      renderKeyDates(date);

      const el = document.getElementById('saints');
      el.innerHTML = '<div class="loading">Φόρτωση του συναξαριστή…</div>';
      const myId = ++requestId;
      const m = date.getMonth() + 1, d = date.getDate();
      const saintUrl = `https://www.saint.gr/${String(m).padStart(2, '0')}/${String(d).padStart(2, '0')}/index.aspx`;

      let saints;
      try {
        saints = await loadSaints(m, d);
      } catch (err) {
        if (myId !== requestId) return;
        el.innerHTML = `<div class="error"><strong>Δεν ήταν δυνατή η φόρτωση του συναξαριστή.</strong><br>
          Δοκιμάστε ξανά σε λίγο ή δείτε τον απευθείας στο <a href="${esc(saintUrl)}" target="_blank" rel="noopener">saint.gr</a>.
          <br><button class="link-btn" type="button" onclick="render(viewDate)">Νέα προσπάθεια</button>
          <div style="font-size:12px;opacity:.7;margin-top:.4rem">${esc(err.message)}</div></div>`;
        return;
      }
      if (myId !== requestId) return;

      // Χωρίς μεγάλη εορτή, η κάρτα δείχνει τους κύριους αγίους της ημέρας
      const mem = document.getElementById('syn-mem');
      if (mem && !mem.hidden) mem.innerHTML = '<small>Τιμώνται σήμερα</small>' + saints.slice(0, 3).map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join(' · ');
      el.innerHTML = `<ul class="saints">${saints.map(s =>
          `<li>${CROSS}<a href="${esc(s.url)}" target="_blank" rel="noopener" title="Ο βίος στο saint.gr">${esc(s.name)}</a></li>`).join('')}</ul>
         <div class="source-note">Πηγή: <a href="${esc(saintUrl)}" target="_blank" rel="noopener">saint.gr</a></div>`;
    }

    function shiftDay(delta) { viewDate = C.addDays(viewDate, delta); render(viewDate); }
    function goToday() { viewDate = new Date(now.getFullYear(), now.getMonth(), now.getDate()); render(viewDate); }
    function pickDate() {
      const v = document.getElementById('date-picker').value;
      if (!v) return;
      const [y, m, d] = v.split('-').map(Number);
      viewDate = new Date(y, m - 1, d);
      render(viewDate);
    }

    render(viewDate);
  </script>
</body>

</html>
