<!DOCTYPE html>
<html lang="el">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Εορτολόγιο — Ορθόδοξο Ημερολόγιο</title>
  <style>
    :root {
      color-scheme: light dark;
      --font-sans: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      --font-serif: Georgia, "Times New Roman", serif;
      --color-text-primary: #1f1f1f;
      --color-text-secondary: #5b5b5b;
      --color-text-tertiary: #8a8a8a;
      --color-text-warning: #7a4f0d;
      --color-border-secondary: #d8d1c7;
      --color-border-tertiary: #e8e1d8;
      --color-background-primary: #fffdfa;
      --color-background-secondary: #f5f0e8;
      --color-background-warning: #fff0d6;
      --border-radius-md: 12px;
      --border-radius-lg: 18px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-text-primary: #f3ede4;
        --color-text-secondary: #c8bcae;
        --color-text-tertiary: #9b8f81;
        --color-text-warning: #ffd58a;
        --color-border-secondary: #5f5141;
        --color-border-tertiary: #4c4034;
        --color-background-primary: #1f1a15;
        --color-background-secondary: #2b241d;
        --color-background-warning: #49310b;
      }
      body {
        background:
          radial-gradient(circle at top, rgba(250, 199, 117, 0.10), transparent 32%),
          linear-gradient(180deg, #17130f 0%, #211a14 100%);
      }
    }

    @media (max-width: 620px) {
      .ort-header { flex-wrap: wrap; }
      .nav-links { order: 3; width: 100%; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 2px; scrollbar-width: none; }
      .nav-links::-webkit-scrollbar { display: none; }
      .nav-pill { flex-shrink: 0; }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { overflow-y: scroll; }
    body {
      font-family: var(--font-sans);
      color: var(--color-text-primary);
      background:
        radial-gradient(circle at top, rgba(186,117,23,0.10), transparent 32%),
        linear-gradient(180deg, #f7f2ea 0%, #fdfbf7 100%);
    }
    .ort-root { padding: 0 0 2rem; }
    .ort-shell { width: min(100%, 860px); margin: 0 auto; padding: 2rem 1rem 2.5rem; }
    .ort-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 1.5rem; padding-bottom: 1rem;
      border-bottom: 0.5px solid var(--color-border-tertiary);
    }
    .ort-cross { font-size: 22px; color: #BA7517; }
    .ort-title { font-size: 20px; font-weight: 500; color: var(--color-text-primary); font-family: var(--font-serif); }
    .nav-pill {
      font-size: 12px; color: var(--color-text-secondary); text-decoration: none;
      white-space: nowrap; padding: 4px 10px;
      border: 0.5px solid var(--color-border-tertiary); border-radius: 999px;
      transition: background 0.15s;
    }
    .nav-pill:hover { background: var(--color-background-secondary); }
    .nav-pill.active {
      background: var(--color-background-secondary);
      border-color: var(--color-border-secondary);
      color: var(--color-text-primary); cursor: default; pointer-events: none;
    }
    .nav-links { display: flex; gap: 6px; flex-shrink: 0; }

    /* ── Date navigation ─────────────────────────────────────── */
    .date-nav {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; margin-bottom: 1.5rem; flex-wrap: wrap;
    }
    .date-nav-btn {
      background: none; border: 0.5px solid var(--color-border-secondary);
      border-radius: 999px; padding: 5px 14px; cursor: pointer;
      font-size: 13px; color: var(--color-text-secondary);
      transition: background 0.15s;
    }
    .date-nav-btn:hover { background: var(--color-background-secondary); }
    .date-nav-btn.today-btn { color: var(--color-text-primary); font-weight: 500; }
    .date-input-wrap {
      display: flex; align-items: center; gap: 6px;
      border: 0.5px solid var(--color-border-secondary);
      border-radius: var(--border-radius-md); padding: 5px 12px;
      background: var(--color-background-primary);
      font-size: 14px; color: var(--color-text-primary);
    }
    .date-input-wrap input[type="date"] {
      border: none; background: transparent; font-family: inherit;
      font-size: 14px; color: var(--color-text-primary); outline: none;
    }

    /* ── Content cards ───────────────────────────────────────── */
    .syn-card {
      border: 0.5px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-lg);
      background: var(--color-background-primary);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
    }
    .syn-day-title {
      font-size: 22px; font-weight: 500; font-family: var(--font-serif);
      color: var(--color-text-primary); margin-bottom: 4px;
    }
    .syn-day-subtitle {
      font-size: 14px; color: var(--color-text-secondary); margin-bottom: 1rem;
    }
    .syn-meta-row {
      display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 0.75rem;
    }
    .syn-badge {
      font-size: 12px; padding: 3px 10px;
      border-radius: 999px; border: 0.5px solid var(--color-border-secondary);
      color: var(--color-text-secondary); background: var(--color-background-secondary);
      white-space: nowrap;
    }
    .syn-section-title {
      font-size: 13px; font-weight: 600; color: var(--color-text-secondary);
      text-transform: uppercase; letter-spacing: 0.05em;
      margin: 1rem 0 0.5rem;
      padding-top: 0.75rem; border-top: 0.5px solid var(--color-border-tertiary);
    }
    .syn-saints-list {
      list-style: none; margin: 0; padding: 0;
    }
    .syn-saints-list li {
      font-size: 15px; color: var(--color-text-primary);
      padding: 4px 0; border-bottom: 0.5px solid var(--color-border-tertiary);
    }
    .syn-saints-list li:last-child { border-bottom: none; }
    .syn-saints-list li::before { content: '☩ '; color: #BA7517; }
    .syn-story {
      font-size: 14px; line-height: 1.7; color: var(--color-text-secondary);
    }
    .syn-story p { margin: 0 0 0.75rem; }
    .syn-story p:last-child { margin-bottom: 0; }
    .syn-readings-row {
      display: flex; gap: 8px; flex-wrap: wrap; margin-top: 0.25rem;
    }
    .syn-reading-chip {
      font-size: 13px; padding: 4px 12px;
      border: 0.5px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      color: var(--color-text-secondary);
      background: var(--color-background-secondary);
    }
    .syn-reading-source {
      font-weight: 600; margin-right: 4px;
    }
    .syn-loading {
      text-align: center; padding: 3rem 0;
      color: var(--color-text-tertiary); font-size: 15px;
    }
    .syn-error {
      padding: 1.25rem 1.5rem;
      border: 0.5px solid #e8d0d0; border-radius: var(--border-radius-lg);
      background: #fff8f8; color: #9a3a3a; font-size: 14px;
    }
    .syn-source-note {
      margin-top: 1rem; font-size: 11px;
      color: var(--color-text-tertiary); text-align: right;
    }
    .syn-source-note a { color: var(--color-text-tertiary); }

    .ort-footer { margin-top: 2rem; padding: 1.25rem 0 0.25rem; border-top: 0.5px solid var(--color-border-tertiary); text-align: center; }
    .footer-text { font-size: 11px; color: var(--color-text-tertiary); line-height: 1.8; }
    .footer-text a { color: var(--color-text-secondary); text-decoration: none; }
    .footer-text a:hover { text-decoration: underline; }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-text-primary: #f3ede4;
        --color-text-secondary: #c8bcae;
        --color-text-tertiary: #9b8f81;
        --color-text-warning: #ffd58a;
        --color-border-secondary: #5f5141;
        --color-border-tertiary: #4c4034;
        --color-background-primary: #1f1a15;
        --color-background-secondary: #2b241d;
        --color-background-warning: #49310b;
      }
      body {
        background:
          radial-gradient(circle at top, rgba(250, 199, 117, 0.10), transparent 32%),
          linear-gradient(180deg, #17130f 0%, #211a14 100%);
      }
    }
  </style>
</head>

<body>
  <div class="ort-root">
    <div class="ort-shell">

      <div class="ort-header">
        <span class="ort-cross">☩</span>
        <div style="flex:1">
          <div class="ort-title">Εορτολόγιο</div>
        </div>
        <nav class="nav-links">
          <a href="main.html" class="nav-pill">Νηστειοδρόμιο</a>
          <a href="sermons.html" class="nav-pill">Ομιλίες</a>
          <a href="synaxarion.html" class="nav-pill active">Εορτολόγιο</a>
          <a href="fasting.html" class="nav-pill">Περί νηστείας</a>
        </nav>
      </div>

      <div class="date-nav">
        <button class="date-nav-btn" onclick="shiftDay(-1)" aria-label="Προηγούμενη ημέρα">←</button>
        <div class="date-input-wrap">
          <input type="date" id="date-picker" onchange="pickDate()">
        </div>
        <button class="date-nav-btn" onclick="shiftDay(1)" aria-label="Επόμενη ημέρα">→</button>
        <button class="date-nav-btn today-btn" onclick="goToday()">Σήμερα</button>
      </div>

      <div id="syn-content"><div class="syn-loading">Φόρτωση…</div></div>

      <footer class="ort-footer">
        <p class="footer-text">
          Υπό ανάπτυξη &nbsp;·&nbsp;
          Δεδομένα αγιολογίου: <a href="https://orthocal.info" target="_blank" rel="noopener">orthocal.info</a>
          &nbsp;·&nbsp; <a href="mailto:konkornarakis@gmail.com">konkornarakis@gmail.com</a>
        </p>
      </footer>

    </div>
  </div>

  <script>
    const now = new Date();
    let viewDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());

    const GR_DAYS_FULL = ['Κυριακή','Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο'];
    const GR_MONTHS_GEN = ['Ιανουαρίου','Φεβρουαρίου','Μαρτίου','Απριλίου','Μαΐου','Ιουνίου','Ιουλίου','Αυγούστου','Σεπτεμβρίου','Οκτωβρίου','Νοεμβρίου','Δεκεμβρίου'];

    function formatDateGR(d) {
      return GR_DAYS_FULL[d.getDay()] + ', ' + d.getDate() + ' ' + GR_MONTHS_GEN[d.getMonth()] + ' ' + d.getFullYear();
    }

    function toISODate(d) {
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function fastLevelLabel(level, desc) {
      if (!desc) return null;
      return desc;
    }

    const TONE_GR = ['','Α\'','Β\'','Γ\'','Δ\'','Πλ. Α\'','Βαρύς','Πλ. Δ\'','Α\''];

    async function fetchAndRender(date) {
      const picker = document.getElementById('date-picker');
      picker.value = toISODate(date);

      const el = document.getElementById('syn-content');
      el.innerHTML = '<div class="syn-loading">Φόρτωση…</div>';

      const y = date.getFullYear(), mo = date.getMonth() + 1, d = date.getDate();
      const url = `https://orthocal.info/api/gregorian/${y}/${mo}/${d}/`;

      let data;
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 10000);
        const resp = await fetch(url, { signal: ctrl.signal });
        clearTimeout(timer);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        data = await resp.json();
      } catch (err) {
        el.innerHTML = `<div class="syn-error">
          <strong>Δεν ήταν δυνατή η φόρτωση των δεδομένων.</strong><br>
          Ελέγξτε τη σύνδεσή σας ή δοκιμάστε αργότερα.<br>
          <small style="opacity:0.7">${err.message}</small>
        </div>`;
        return;
      }

      const toneLabel = data.tone > 0 ? (TONE_GR[data.tone] || ('Ήχος ' + data.tone)) : null;

      const saints = data.saints || [];
      const feasts = (data.feasts && data.feasts.length) ? data.feasts : [];
      const stories = data.stories || [];
      const readings = data.readings || [];
      const title = data.summary_title || (data.titles && data.titles[0]) || '';
      const fastDesc = data.fast_exception_desc || data.fast_level_desc || '';

      // badges
      const badges = [];
      if (toneLabel) badges.push(`Ήχος ${toneLabel}`);

      let html = `<div class="syn-card">
  <div class="syn-day-title">${escHtml(title) || formatDateGR(date)}</div>
  <div class="syn-day-subtitle">${formatDateGR(date)}</div>
  <div class="syn-meta-row">
    ${badges.map(b => `<span class="syn-badge">${escHtml(b)}</span>`).join('')}
  </div>`;

      if (feasts.length) {
        html += `<div class="syn-section-title">Εορτές</div>
  <ul class="syn-saints-list">
    ${feasts.map(f => `<li>${escHtml(f)}</li>`).join('')}
  </ul>`;
      }

      if (saints.length) {
        html += `<div class="syn-section-title">Άγιοι της ημέρας</div>
  <ul class="syn-saints-list">
    ${saints.map(s => `<li>${escHtml(s)}</li>`).join('')}
  </ul>`;
      }

      html += '</div>'; // close main card

      // Stories
      stories.forEach(story => {
        if (!story.story) return;
        html += `<div class="syn-card">
  <div style="font-size:16px;font-weight:600;margin-bottom:0.75rem;font-family:var(--font-serif)">${escHtml(story.title || '')}</div>
  <div class="syn-story">${story.story}</div>
</div>`;
      });

      // Readings
      if (readings.length) {
        html += `<div class="syn-card">
  <div class="syn-section-title" style="margin-top:0;padding-top:0;border-top:none">Αναγνώσματα</div>
  <div class="syn-readings-row">
    ${readings.map(r => `<div class="syn-reading-chip"><span class="syn-reading-source">${escHtml(r.source)}:</span>${escHtml(r.display || '')}</div>`).join('')}
  </div>
</div>`;
      }

      html += '<div class="syn-source-note">Δεδομένα: <a href="https://orthocal.info" target="_blank" rel="noopener">orthocal.info</a> (New Calendar / Gregorian)</div>';

      el.innerHTML = html;
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
    }

    function shiftDay(delta) {
      viewDate = new Date(viewDate.getTime());
      viewDate.setDate(viewDate.getDate() + delta);
      fetchAndRender(viewDate);
    }

    function goToday() {
      viewDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      fetchAndRender(viewDate);
    }

    function pickDate() {
      const v = document.getElementById('date-picker').value;
      if (!v) return;
      const parts = v.split('-').map(Number);
      viewDate = new Date(parts[0], parts[1]-1, parts[2]);
      fetchAndRender(viewDate);
    }

    // Note: story.story is HTML from orthocal.info, a trusted liturgical API.
    // It contains only formatting tags (<p>, <i>, <b>) and is not user-generated.
    fetchAndRender(viewDate);
  </script>
</body>
</html>
