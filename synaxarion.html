<!DOCTYPE html>
<html lang="el">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Εορτολόγιο — Ορθόδοξο Σημειωματάριο</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="assets/site.css">
  <script src="assets/site.js"></script>
  <script src="assets/calendar.js"></script>
  <style>
    .date-nav { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .date-arrow {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid var(--rule); background: var(--vellum); color: var(--ink-soft);
      font-size: 18px; line-height: 1; cursor: pointer;
    }
    .date-arrow:hover { border-color: var(--gold); color: var(--cinnabar); }
    .date-input {
      height: 36px; padding: 0 12px; border-radius: 999px;
      border: 1px solid var(--rule); background: var(--vellum); color: var(--ink);
      font-family: var(--font-body); font-size: 15px;
    }

    .syn-head { text-align: center; }
    .syn-wd { font-family: var(--font-display); font-size: 18px; color: var(--ink-soft); }
    .syn-date { font-family: var(--font-display); font-size: clamp(28px, 5vw, 38px); line-height: 1.15; color: var(--ink); }
    .syn-date.red { color: var(--cinnabar); }
    .syn-fast {
      display: inline-flex; align-items: center; gap: 8px; margin-top: .6rem;
      padding: 4px 14px; border: 1px solid var(--rule-soft); border-radius: 999px;
      font-size: 14.5px; color: var(--ink);
    }
    .syn-fast a { color: inherit; text-decoration: none; }
    .syn-feasts { list-style: none; margin: 1rem 0 0; padding: 0; text-align: center; }
    .syn-feasts li { font-family: var(--font-display); font-size: 20px; line-height: 1.35; color: var(--ink); }
    .syn-feasts li.red { color: var(--cinnabar); }
    .syn-names { text-align: center; margin: .5rem 0 0; color: var(--ink-soft); font-size: 15px; }
    .syn-names b { font-weight: 600; color: var(--ink); }

    .saints-title { margin-top: 1.6rem; }
    .saints { list-style: none; margin: 0; padding: 0; columns: 2 300px; column-gap: 2rem; }
    .saints li {
      break-inside: avoid; display: flex; gap: 10px; align-items: baseline;
      padding: .45rem 0; border-bottom: 1px solid var(--rule-soft); font-size: 16px;
    }
    .saints li svg { width: 10px; height: 10px; color: var(--cinnabar); flex: none; position: relative; top: 1px; }
    .loading { text-align: center; padding: 2.5rem 0; color: var(--ink-faint); font-style: italic; }
    .error { padding: 1rem 1.2rem; border: 1px solid var(--rule); border-left: 3px solid var(--cinnabar); border-radius: 6px; background: var(--vellum); color: var(--ink-soft); font-size: 15px; }
    .source-note { margin-top: .8rem; font-size: 13px; color: var(--ink-faint); text-align: right; }
    .source-note a { color: var(--ink-soft); }
  </style>
</head>

<body>
  <div class="ort-root">
    <div class="ort-shell">
      <header data-page="synaxarion" data-title="Εορτολόγιο" data-subtitle="Οι άγιοι και οι εορτές κάθε ημέρας"></header>

      <main>
        <div class="date-nav">
          <button class="date-arrow" type="button" onclick="shiftDay(-1)" aria-label="Προηγούμενη ημέρα">‹</button>
          <input type="date" id="date-picker" class="date-input" onchange="pickDate()" aria-label="Ημερομηνία">
          <button class="date-arrow" type="button" onclick="shiftDay(1)" aria-label="Επόμενη ημέρα">›</button>
          <button class="btn" type="button" onclick="goToday()">Σήμερα</button>
        </div>

        <section id="day-head" class="panel"></section>

        <section class="section saints-title">
          <h2 class="section-heading">Οι άγιοι της ημέρας</h2>
          <div id="saints"><div class="loading">Φόρτωση…</div></div>
        </section>
      </main>

      <footer data-site-footer>Ο κατάλογος των αγίων προέρχεται από τον Ορθόδοξο Συναξαριστή <a href="https://www.saint.gr" target="_blank" rel="noopener">saint.gr</a>.</footer>
    </div>
  </div>

  <script>
    const C = window.OrthoCal;
    const CROSS = window.OrthoSite ? window.OrthoSite.SMALL_CROSS : '';
    const now = new Date();
    let viewDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    let requestId = 0;

    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function toISO(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    function readMonastic() { try { return localStorage.getItem('monasticMode') === 'true'; } catch (e) { return false; } }

    function renderHead(d) {
      const f = C.fasting(d, { monastic: readMonastic() });
      const feasts = C.feastsOf(d);
      const names = C.namedaysOf(d);
      const hymn = C.hymnOf(d);
      const red = d.getDay() === 0 || feasts.some(x => x.rank !== 'minor');
      document.getElementById('day-head').innerHTML = `
        <div class="syn-head">
          <div class="syn-wd">${C.DAYS[d.getDay()]}</div>
          <div class="syn-date${red ? ' red' : ''}">${d.getDate()} ${C.MONTHS_GEN[d.getMonth()]} ${d.getFullYear()}</div>
          <div class="syn-fast"><span class="seal lv-${f.level}"></span><a href="main.html" title="Άνοιγμα στο νηστειοδρόμιο">${esc(f.label)}${f.period ? ' · ' + esc(f.period) : ''}</a></div>
          ${feasts.length ? `<ul class="syn-feasts">${feasts.map(x => `<li class="${x.rank !== 'minor' ? 'red' : ''}">${esc(x.name)}</li>`).join('')}</ul>` : ''}
          ${names.length ? `<p class="syn-names"><b>Εορτάζουν:</b> ${esc(names.join(', '))}</p>` : ''}
        </div>
        <blockquote class="hymn">
          <p class="hymn-text">${esc(hymn.text)}</p>
          <cite class="hymn-src">${esc(hymn.src)}</cite>
        </blockquote>`;
    }

    async function render(date) {
      document.getElementById('date-picker').value = toISO(date);
      renderHead(date);

      const el = document.getElementById('saints');
      el.innerHTML = '<div class="loading">Φόρτωση…</div>';
      const myId = ++requestId;

      const mm = String(date.getMonth() + 1).padStart(2, '0');
      const dd = String(date.getDate()).padStart(2, '0');
      // Ο saint.gr δεν επιτρέπει απευθείας κλήσεις από τον browser· περνάμε από διαμεσολαβητή CORS.
      const saintUrl = `https://www.saint.gr/${mm}/${dd}/index.aspx`;
      const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(saintUrl)}`;

      const saints = [];
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 12000);
        const resp = await fetch(proxyUrl, { signal: ctrl.signal });
        clearTimeout(timer);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const json = await resp.json();
        const doc = new DOMParser().parseFromString(json.contents || '', 'text/html');
        const seen = new Set();
        for (const a of doc.querySelectorAll('a[href*="/saint.aspx"]')) {
          let name = a.textContent.replace(/\s+/g, ' ').trim();
          // Ο saint.gr αποδίδει κάθε όνομα δύο φορές στον ίδιο σύνδεσμο
          const half = name.length / 2;
          if (Number.isInteger(half) && name.slice(0, half).trim() === name.slice(half).trim()) name = name.slice(0, half).trim();
          if (name && !seen.has(name)) { seen.add(name); saints.push(name); }
        }
      } catch (err) {
        if (myId !== requestId) return;
        el.innerHTML = `<div class="error"><strong>Δεν ήταν δυνατή η φόρτωση του συναξαριστή.</strong><br>
          Ελέγξτε τη σύνδεσή σας ή δοκιμάστε ξανά αργότερα. Μπορείτε επίσης να τον δείτε απευθείας στο
          <a href="${esc(saintUrl)}" target="_blank" rel="noopener">saint.gr</a>.</div>`;
        return;
      }
      if (myId !== requestId) return;

      el.innerHTML = saints.length
        ? `<ul class="saints">${saints.map(s => `<li>${CROSS}<span>${esc(s)}</span></li>`).join('')}</ul>
           <div class="source-note">Πηγή: <a href="${esc(saintUrl)}" target="_blank" rel="noopener">saint.gr</a></div>`
        : '<div class="loading">Δεν βρέθηκαν άγιοι για αυτή την ημέρα.</div>';
    }

    function shiftDay(delta) { viewDate = C.addDays(viewDate, delta); render(viewDate); }
    function goToday() { viewDate = new Date(now.getFullYear(), now.getMonth(), now.getDate()); render(viewDate); }
    function pickDate() {
      const v = document.getElementById('date-picker').value;
      if (!v) return;
      const [y, m, d] = v.split('-').map(Number);
      viewDate = new Date(y, m - 1, d);
      render(viewDate);
    }

    render(viewDate);
  </script>
</body>

</html>
