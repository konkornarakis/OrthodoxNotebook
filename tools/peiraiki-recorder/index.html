<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Πειραϊκή Εκκλησία — Ηχογραφήσεις</title>
<style>
  :root { --bg:#faf7f2; --fg:#2b2620; --muted:#7a6f63; --card:#fff; --line:#e6ddd0; --accent:#8a3b12; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1916; --fg:#ece6dc; --muted:#a0968a; --card:#25221e; --line:#3a352f; --accent:#e0915c; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:720px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .player { position:sticky; top:0; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:20px; }
  .now { font-weight:600; margin-bottom:8px; min-height:1.5em; }
  audio { width:100%; }
  .day { background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:12px; overflow:hidden; }
  .day > button { all:unset; display:flex; justify-content:space-between; width:100%; padding:12px 14px; cursor:pointer; box-sizing:border-box; }
  .day > button:hover { background:color-mix(in srgb, var(--accent) 8%, transparent); }
  .live { color:#c0392b; font-weight:600; }
  ol { margin:0; padding:0 14px 12px 40px; }
  li { padding:3px 0; cursor:pointer; color:var(--muted); }
  li.playing { color:var(--accent); font-weight:600; }
  li a { color:inherit; margin-left:8px; font-size:.85em; }
  .err { color:#c0392b; }
</style>
</head>
<body>
<main>
  <h1>Πειραϊκή Εκκλησία 91.2</h1>
  <p class="sub">Καθημερινές ηχογραφήσεις 22:00–03:00. Όσο γράφει, τα κομμάτια των 10 λεπτών εμφανίζονται εδώ και παίζουν διαδοχικά.</p>
  <div class="player">
    <div class="now" id="now">Διάλεξε ηχογράφηση</div>
    <audio id="audio" controls preload="none"></audio>
  </div>
  <div id="list">Φόρτωση…</div>
</main>
<script>
const REPO = "konkornarakis/peiraiki-recordings";
const audio = document.getElementById("audio");
const nowEl = document.getElementById("now");
const listEl = document.getElementById("list");
let queue = [], idx = -1, currentTag = null, openTag = null;

const fmtPart = n => {
  const m = n.match(/_(\d{2})-(\d{2})-\d{2}\.mp3$/);
  return n.includes("olokliro") ? "Ολόκληρη η ηχογράφηση" : (m ? `${m[1]}:${m[2]}` : n);
};
const tracks = r => r.assets.filter(a => a.name.endsWith(".mp3")).sort((a, b) => a.name.localeCompare(b.name));
const isLive = r => !r.assets.some(a => a.name.includes("olokliro"));

function play(tag, list, i, keepTime) {
  currentTag = tag; queue = list; idx = i;
  const t = keepTime ? audio.currentTime : 0;
  audio.src = list[i].browser_download_url;
  audio.currentTime = t;
  audio.play().catch(() => {});
  nowEl.textContent = `${tag.replace("rec-", "")} · ${fmtPart(list[i].name)}`;
  render(lastReleases);
}
audio.addEventListener("ended", () => { if (idx + 1 < queue.length) play(currentTag, queue, idx + 1); });

let lastReleases = [];
function render(releases) {
  listEl.innerHTML = "";
  releases.forEach(r => {
    const t = tracks(r); if (!t.length) return;
    const live = isLive(r);
    const d = document.createElement("div"); d.className = "day";
    const b = document.createElement("button");
    b.innerHTML = `<span>${r.name || r.tag_name}</span><span>${live ? '<span class="live">● ζωντανά</span> · ' : ""}${live ? t.length * 10 + "′" : ""}</span>`;
    b.onclick = () => { openTag = openTag === r.tag_name ? null : r.tag_name; render(lastReleases); };
    d.appendChild(b);
    if (openTag === r.tag_name || currentTag === r.tag_name) {
      const ol = document.createElement("ol");
      t.forEach((a, i) => {
        const li = document.createElement("li");
        li.textContent = fmtPart(a.name);
        if (currentTag === r.tag_name && queue[idx] && queue[idx].name === a.name) li.className = "playing";
        li.onclick = () => play(r.tag_name, t, i);
        const dl = document.createElement("a"); dl.href = a.browser_download_url; dl.textContent = "λήψη";
        dl.onclick = e => e.stopPropagation(); li.appendChild(dl);
        ol.appendChild(li);
      });
      d.appendChild(ol);
    }
    listEl.appendChild(d);
  });
  if (!listEl.children.length) listEl.textContent = "Δεν υπάρχουν ακόμα ηχογραφήσεις.";
}

async function load() {
  try {
    const res = await fetch(`https://api.github.com/repos/${REPO}/releases?per_page=60`, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    lastReleases = await res.json();
    if (openTag === null && lastReleases[0]) openTag = lastReleases[0].tag_name;
    // Ενημέρωση της ουράς αν η τρέχουσα ηχογράφηση πήρε νέα κομμάτια ή ενώθηκε.
    if (currentTag) {
      const r = lastReleases.find(x => x.tag_name === currentTag);
      if (r) {
        const t = tracks(r);
        const same = t.findIndex(a => a.name === (queue[idx] || {}).name);
        if (same >= 0) { queue = t; idx = same; }
      }
    }
    render(lastReleases);
  } catch (e) {
    listEl.innerHTML = `<p class="err">Σφάλμα φόρτωσης (${e.message}). Δοκίμασε ξανά σε λίγο.</p>`;
  }
}
load(); setInterval(load, 120000);
</script>
</body>
</html>
